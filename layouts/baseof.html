<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Summary | default site.Params.descricao | plainify }}">
{{ with resources.Get "css/main.css" | minify }}<style>{{ .Content | safeCSS }}</style>{{ end }}
</head>
<body>
<header class="site-header">
  <a class="site-name" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  <nav>
    {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <p>{{ site.Title }} · Escola de Comunicações e Artes, Universidade de São Paulo</p>
</footer>
</body>
</html>
