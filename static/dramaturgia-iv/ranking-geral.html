<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparação de roteiros</title>
<style>
:root {
  --bg: #fbfaf8; --fg: #1c1b19; --muted: #6b675f; --accent: #7a2e2e;
  --rule: #e2ded6; --card: #fff; --shadow: rgba(0,0,0,.06); --win: #2f6b3a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191817; --fg: #e8e5df; --muted: #a29d93; --accent: #d08770;
    --rule: #33312d; --card: #211f1d; --shadow: rgba(0,0,0,.4); --win: #7bbf88;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif; line-height: 1.6;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
.sub { color: var(--muted); margin-top: 0; }
label { display: block; font-size: .9rem; color: var(--muted); margin: 1.2rem 0 .3rem; }
input[type=text], textarea {
  width: 100%; padding: .55rem .7rem; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
}
textarea { min-height: 4.2rem; resize: vertical; }
.bar { height: 5px; background: var(--rule); border-radius: 3px; margin: 1.5rem 0 .4rem; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.count { font-size: .85rem; color: var(--muted); text-align: right; }
.crit { text-align: center; font-size: 1.05rem; margin: 1.4rem 0 1rem; }
.crit b { color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 34rem) { .pair { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 2px solid var(--rule); border-radius: 10px;
  padding: 1rem; box-shadow: 0 1px 3px var(--shadow); display: flex; flex-direction: column; gap: .6rem;
}
.card.sel { border-color: var(--win); }
.card .t { font-weight: 700; }
.card .clabel { font-size: .82rem; color: var(--muted); margin: 0; }
.card .ccount { font-size: .72rem; color: var(--muted); text-align: right; margin: 0; }
.card .ccount.cheio { color: var(--accent); }
.open {
  display: inline-block; align-self: flex-start; font-size: .9rem; text-decoration: none;
  color: var(--accent); border: 1px solid var(--rule); border-radius: 6px; padding: .3rem .7rem;
}
.open.disabled { color: var(--muted); pointer-events: none; opacity: .6; }
.pick {
  margin-top: .3rem; font: inherit; cursor: pointer; border: 0; border-radius: 6px;
  padding: .55rem; background: var(--accent); color: #fff;
}
.pick.sel { background: var(--win); }
.nav { display: flex; justify-content: space-between; margin-top: 1.4rem; }
button.action {
  font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
  padding: .6rem 1.1rem; cursor: pointer;
}
button.action:disabled { opacity: .45; cursor: default; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--rule); }
.hidden { display: none; }
table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: .88rem; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--rule); padding: .35rem .6rem; text-align: left; vertical-align: top; }
.foot { color: var(--muted); font-size: .8rem; margin-top: 2.5rem; }
.card .clabel, .card .cc, .card .ccount { display: none; }
</style>
</head>

/* ================================================================
   Motor — normalmente não precisa mexer daqui para baixo
================================================================= */
(function () {
  "use strict";
  const $ = function (id) { return document.getElementById(id); };
  const KEY = "comparacao-roteiros-" + TAREFA.replace(/\W+/g, "_");
  const byId = {}; TRABALHOS.forEach(function (t) { byId[t.id] = t; });

  $("titulo").textContent = TITULO;
  $("tarefaNome").textContent = TAREFA;
  $("instrucao").textContent = INSTRUCAO;
  $("criterio").innerHTML = CRITERIO;

  // Monta as duplas do conjunto designado ao aluno (designação fixa, ver CONJUNTOS).
  // Só a ordem das duplas e o lado de cada roteiro são embaralhados.
  // Cada dupla guarda a escolha e um comentário por roteiro (ca = sobre 'a', cb = sobre 'b').
  function embaralhar(v) {
    for (let k = v.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      const tmp = v[k]; v[k] = v[r]; v[r] = tmp;
    }
    return v;
  }

  function montarPares(designacao) {
    const duplas = designacao.map(function (d) { return d.slice(); });  // ordem fixa: 1–3 trazem os seis roteiros
    return duplas.map(function (d) {
      const lados = embaralhar(d.slice());
      return { a: lados[0], b: lados[1], escolha: null, ca: "", cb: "" };
    });
  }

  let pares = [], i = 0, nome = "", identificacao = "";

  // Normaliza o nome (sem acento, sem caixa, espaços colapsados) e gera as
  // grafias aceitas: nome inteiro, primeiro+último, primeiro+dois últimos.
  function normalizar(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  }

  function chavesDoNome(s) {
    const p = normalizar(s).split(" ").filter(Boolean);
    if (!p.length) return [];
    const ks = [p.join(" ")];
    if (p.length >= 2) ks.push(p[0] + " " + p[p.length - 1]);
    if (p.length >= 3) ks.push(p[0] + " " + p[p.length - 2] + " " + p[p.length - 1]);
    return ks;
  }

  function hash(s) {
    let h = 5381;
    const bytes = new TextEncoder().encode(s);
    for (let k = 0; k < bytes.length; k++) h = (((h * 33) ^ bytes[k]) >>> 0);
    return ("0000000" + h.toString(16)).slice(-8);
  }

  function designacaoPorNome(s) {
    const ks = chavesDoNome(s);
    for (let k = 0; k < ks.length; k++) {
      const d = DESIGNACOES[hash(ks[k])];
      if (d) return d;
    }
    return null;
  }

  function contar(card) {
    const cc = card.querySelector(".cc");
    const el = card.querySelector(".ccount");
    el.textContent = cc.value.length + "/" + MAX_COMENTARIO;
    el.classList.toggle("cheio", cc.value.length >= MAX_COMENTARIO);
  }

  function pintarCard(card, obra, escolhido, coment) {
    card.classList.toggle("sel", escolhido);
    card.querySelector(".t").textContent = obra.titulo;
    const link = card.querySelector(".open");
    if (obra.url) { link.href = obra.url; link.classList.remove("disabled"); link.textContent = "Abrir roteiro ↗"; }
    else { link.removeAttribute("href"); link.classList.add("disabled"); link.textContent = "(link do PDF ainda não definido)"; }
    const cc = card.querySelector(".cc");
    cc.maxLength = MAX_COMENTARIO;
    cc.value = (coment || "").slice(0, MAX_COMENTARIO);
    contar(card);
    const btn = card.querySelector(".pick");
    btn.classList.toggle("sel", escolhido);
    btn.textContent = escolhido ? "✓ Escolhido como melhor" : "Este é melhor";
  }

  function mostrar() {
    const p = pares[i];
    $("progresso").style.width = (i / pares.length * 100) + "%";
    $("contador").textContent = "Dupla " + (i + 1) + " de " + pares.length;
    pintarCard($("cardEsq"), byId[p.a], p.escolha === p.a, p.ca);
    pintarCard($("cardDir"), byId[p.b], p.escolha === p.b, p.cb);
    $("proximo").disabled = !p.escolha;
    $("voltar").style.visibility = i === 0 ? "hidden" : "visible";
    $("proximo").textContent = (i === pares.length - 1) ? "Concluir ✓" : "Próximo →";
  }

  function escolher(lado) {
    const p = pares[i];
    p.escolha = (lado === "esq") ? p.a : p.b;
    salvar(); mostrar();
  }

  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify({ nome: nome, identificacao: identificacao, pares: pares })); } catch (e) {}
  }

  function terminar() {
    salvar();
    $("jogo").classList.add("hidden");
    $("fim").classList.remove("hidden");
    $("nomeFim").textContent = nome || "aluno(a)";
    let html = "<tr><th>Roteiro</th><th>Resultado</th></tr>";
    pares.forEach(function (p) {
      [[p.a, p.ca], [p.b, p.cb]].forEach(function (par) {
        const id = par[0], venceu = (p.escolha === id);
        html += "<tr><td>" + byId[id].titulo + "</td><td>" +
          (venceu ? "escolhido" : "não escolhido") + "</td></tr>";
      });
    });
    $("tabela").innerHTML = html;
    enviar();
  }

  function montarPayload() {
    const linhas = [];
    pares.forEach(function (p, k) {
      linhas.push({ dupla: k + 1, roteiro: p.a, venceu: (p.escolha === p.a ? "sim" : "nao"), adversario: p.b, comentario: p.ca });
      linhas.push({ dupla: k + 1, roteiro: p.b, venceu: (p.escolha === p.b ? "sim" : "nao"), adversario: p.a, comentario: p.cb });
    });
    return { nome: nome, identificacao: identificacao, tarefa: TAREFA, linhas: linhas };
  }

  function enviar() {
    const st = $("envioStatus");
    if (!ENDPOINT) { st.textContent = "Baixe a cópia abaixo e envie ao professor."; return; }
    st.textContent = "Enviando ao professor…";
    try {
      fetch(ENDPOINT, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(montarPayload())
      }).then(function () {
        st.textContent = "✓ Respostas enviadas ao professor. (Guarde uma cópia abaixo, por segurança.)";
      }).catch(function () {
        st.textContent = "Não foi possível enviar sozinho — baixe a cópia abaixo e envie ao professor.";
      });
    } catch (e) {
      st.textContent = "Não foi possível enviar sozinho — baixe a cópia abaixo e envie ao professor.";
    }
  }

  function csvSeguro(s) {
    s = String(s == null ? "" : s);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function baixar() {
    const linhas = ["nome;identificacao;tarefa;dupla;roteiro;venceu;adversario;comentario"];
    pares.forEach(function (p, k) {
      linhas.push([nome, identificacao, TAREFA, k + 1, p.a, (p.escolha === p.a ? "sim" : "nao"), p.b, p.ca].map(csvSeguro).join(";"));
      linhas.push([nome, identificacao, TAREFA, k + 1, p.b, (p.escolha === p.b ? "sim" : "nao"), p.a, p.cb].map(csvSeguro).join(";"));
    });
    const blob = new Blob(["﻿" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const slug = (nome || "aluno").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    a.href = url; a.download = "comparacao-" + TAREFA.replace(/\W+/g, "_") + "-" + slug + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  $("comecar").addEventListener("click", function () {
    nome = $("nome").value.trim();
    const erro = $("erro");
    if (!nome) { erro.textContent = "Escreva seu nome."; erro.classList.remove("hidden"); return; }

    let designacao = designacaoPorNome(nome);
    identificacao = "nome";

    if (!designacao) {
      // Nome fora da lista (ou escrito de outro jeito): pede o grupo.
      const cx = $("caixaGrupo"), g = $("grupo").value.trim();
      if (cx.classList.contains("hidden")) {
        cx.classList.remove("hidden");
        erro.textContent = "Não achei esse nome na lista da turma. Confira a grafia — ou escolha abaixo os roteiros que você assinou e siga.";
        erro.classList.remove("hidden");
        return;
      }
      if (!POR_GRUPO[g]) { erro.textContent = "Escolha na lista os roteiros que você assinou."; erro.classList.remove("hidden"); return; }
      const opcoes = POR_GRUPO[g];
      designacao = opcoes[Math.floor(Math.random() * opcoes.length)];
      identificacao = "grupo " + g;
    }

    erro.classList.add("hidden");
    pares = montarPares(designacao); i = 0;
    $("intro").classList.add("hidden");
    $("jogo").classList.remove("hidden");
    mostrar();
  });
  $("cardEsq").querySelector(".pick").addEventListener("click", function () { escolher("esq"); });
  $("cardDir").querySelector(".pick").addEventListener("click", function () { escolher("dir"); });
  $("cardEsq").querySelector(".cc").addEventListener("input", function () { pares[i].ca = this.value; contar($("cardEsq")); salvar(); });
  $("cardDir").querySelector(".cc").addEventListener("input", function () { pares[i].cb = this.value; contar($("cardDir")); salvar(); });
  $("proximo").addEventListener("click", function () {
    if (!pares[i].escolha) return;
    if (i < pares.length - 1) { i++; mostrar(); } else { terminar(); }
  });
  $("voltar").addEventListener("click", function () { if (i > 0) { i--; mostrar(); } });
  $("baixar").addEventListener("click", baixar);
  $("refazer").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  });
})();
</script>
