<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercício de comparação</title>
<style>
:root {
  --bg: #fbfaf8; --fg: #1c1b19; --muted: #6b675f; --accent: #7a2e2e;
  --rule: #e2ded6; --card: #fff; --shadow: rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191817; --fg: #e8e5df; --muted: #a29d93; --accent: #d08770;
    --rule: #33312d; --card: #211f1d; --shadow: rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
  line-height: 1.6;
}
.wrap { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 { font-size: 1.6rem; margin: 0 0 .3rem; }
.sub { color: var(--muted); margin-top: 0; }
label { display: block; font-size: .9rem; color: var(--muted); margin: 1.2rem 0 .3rem; }
input[type=text] {
  width: 100%; padding: .55rem .7rem; font: inherit; color: var(--fg);
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
}
.bar { height: 5px; background: var(--rule); border-radius: 3px; margin: 1.5rem 0 .5rem; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.count { font-size: .85rem; color: var(--muted); text-align: right; }
.prompt { text-align: center; font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
.prompt b { color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
@media (max-width: 34rem) { .pair { grid-template-columns: 1fr; } }
.opt {
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
  padding: 1.4rem 1.1rem; font: inherit; color: var(--fg); text-align: left;
  cursor: pointer; box-shadow: 0 1px 3px var(--shadow); transition: border-color .15s, transform .05s;
}
.opt:hover { border-color: var(--accent); }
.opt:active { transform: translateY(1px); }
.opt .t { display: block; font-weight: 700; margin-bottom: .3rem; }
.opt .d { display: block; font-size: .92rem; color: var(--muted); }
button.action {
  font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
  padding: .6rem 1.1rem; cursor: pointer; margin-top: 1rem;
}
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--rule); }
.hidden { display: none; }
.done p { margin: .4rem 0; }
table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: .9rem; }
th, td { border: 1px solid var(--rule); padding: .35rem .6rem; text-align: left; }
.foot { color: var(--muted); font-size: .8rem; margin-top: 2.5rem; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============================================================= -->
  <!-- CONTEÚDO DO EXERCÍCIO — editar apenas o bloco <script> abaixo -->
  <!-- ============================================================= -->

  <div id="intro">
    <h1 id="titulo"></h1>
    <p class="sub" id="instrucao"></p>
    <label for="nome">Seu nome</label>
    <input type="text" id="nome" placeholder="Nome e sobrenome" autocomplete="name">
    <button class="action" id="comecar">Começar</button>
  </div>

  <div id="jogo" class="hidden">
    <div class="bar"><span id="progresso"></span></div>
    <div class="count" id="contador"></div>
    <p class="prompt" id="criterio"></p>
    <div class="pair">
      <button class="opt" id="optA"><span class="t"></span><span class="d"></span></button>
      <button class="opt" id="optB"><span class="t"></span><span class="d"></span></button>
    </div>
  </div>

  <div id="fim" class="hidden done">
    <h1>Concluído</h1>
    <p>Obrigado, <b id="nomeFim"></b>. Suas respostas foram registradas neste navegador.</p>
    <p><b>Envie o resultado ao professor:</b> baixe o arquivo e anexe onde for indicado (Moodle, e-mail).</p>
    <button class="action" id="baixar">Baixar respostas (CSV)</button>
    <button class="action ghost" id="refazer">Refazer</button>
    <table id="tabela"></table>
  </div>

  <p class="foot">Exercício autocontido — roda inteiramente no seu navegador; nada é enviado a servidor algum.</p>
</div>

<script>
/* ================================================================
   CONFIGURAÇÃO DO EXERCÍCIO  —  trocar por conteúdo real
   ================================================================
   - TITULO / INSTRUCAO: cabeçalho.
   - CRITERIO: a pergunta feita em cada par ("Qual cena é mais...?").
   - PARES: lista de duplas a comparar. Cada item = { t: título, d: descrição }.
     Podem ser cenas, roteiros, planos, decupagens — texto puro.
   Para trocar o que aparece, basta editar estas quatro variáveis.
================================================================= */

const TITULO = "Comparação de cenas — exemplo";
const INSTRUCAO = "Em cada par, escolha a cena que melhor satisfaz o critério. Não há resposta certa: é um exercício de olhar.";
const CRITERIO = "Qual cena tem <b>encenação mais autônoma</b> em relação à narração?";

const PARES = [
  [ {t:"Cena A1", d:"Plano-sequência, câmera observa à distância, sem cortes."},
    {t:"Cena B1", d:"Montagem rápida de detalhes, câmera conduz o olhar."} ],
  [ {t:"Cena A2", d:"Diálogo em campo/contracampo clássico."},
    {t:"Cena B2", d:"Diálogo encenado em profundidade, dois planos de ação."} ],
  [ {t:"Cena A3", d:"Ação coreografada no quadro, corte quase invisível."},
    {t:"Cena B3", d:"Ação fragmentada, sentido nasce na colagem."} ],
  [ {t:"Cena A4", d:"Espaço teatral, entradas e saídas pelas laterais."},
    {t:"Cena B4", d:"Espaço reconstruído pela edição, geografia elíptica."} ],
];

/* ================================================================
   Motor do exercício — normalmente não precisa mexer daqui pra baixo
================================================================= */
(function () {
  "use strict";
  const $ = function (id) { return document.getElementById(id); };
  const KEY = "exercicio-comparacao-v1";

  $("titulo").textContent = TITULO;
  $("instrucao").textContent = INSTRUCAO;
  $("criterio").innerHTML = CRITERIO;

  let ordem = [], i = 0, nome = "", respostas = [];

  // Embaralha os pares (Fisher–Yates) e, em cada par, o lado A/B.
  function embaralhar() {
    ordem = PARES.map(function (par, idx) {
      const trocar = Math.random() < 0.5;
      return {
        idx: idx,
        esq: trocar ? par[1] : par[0],
        dir: trocar ? par[0] : par[1],
        rotEsq: trocar ? "B" : "A",
        rotDir: trocar ? "A" : "B"
      };
    });
    for (let k = ordem.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      const tmp = ordem[k]; ordem[k] = ordem[j]; ordem[j] = tmp;
    }
  }

  function mostrar() {
    const p = ordem[i];
    $("progresso").style.width = (i / ordem.length * 100) + "%";
    $("contador").textContent = "Par " + (i + 1) + " de " + ordem.length;
    const a = $("optA"), b = $("optB");
    a.querySelector(".t").textContent = p.esq.t;
    a.querySelector(".d").textContent = p.esq.d;
    b.querySelector(".t").textContent = p.dir.t;
    b.querySelector(".d").textContent = p.dir.d;
  }

  function escolher(lado) {
    const p = ordem[i];
    const escolhido = lado === "esq" ? p.rotEsq : p.rotDir;
    respostas.push({
      par: p.idx + 1,
      escolha: escolhido,
      titulo: (lado === "esq" ? p.esq.t : p.dir.t)
    });
    i++;
    if (i < ordem.length) { mostrar(); } else { terminar(); }
  }

  function terminar() {
    $("progresso").style.width = "100%";
    try { localStorage.setItem(KEY, JSON.stringify({ nome: nome, respostas: respostas })); } catch (e) {}
    $("jogo").classList.add("hidden");
    $("fim").classList.remove("hidden");
    $("nomeFim").textContent = nome || "aluno(a)";
    let html = "<tr><th>Par</th><th>Escolha</th><th>Título</th></tr>";
    respostas.forEach(function (r) {
      html += "<tr><td>" + r.par + "</td><td>" + r.escolha + "</td><td>" + r.titulo + "</td></tr>";
    });
    $("tabela").innerHTML = html;
  }

  function csvSeguro(s) {
    s = String(s == null ? "" : s);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function baixar() {
    let linhas = ["nome;par;escolha;titulo"];
    respostas.forEach(function (r) {
      linhas.push([nome, r.par, r.escolha, r.titulo].map(csvSeguro).join(";"));
    });
    const conteudo = "﻿" + linhas.join("\r\n"); // BOM p/ acentos no Excel
    const blob = new Blob([conteudo], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const slug = (nome || "aluno").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    a.href = url; a.download = "comparacao-" + slug + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  $("comecar").addEventListener("click", function () {
    nome = $("nome").value.trim();
    i = 0; respostas = []; embaralhar();
    $("intro").classList.add("hidden");
    $("jogo").classList.remove("hidden");
    mostrar();
  });
  $("optA").addEventListener("click", function () { escolher("esq"); });
  $("optB").addEventListener("click", function () { escolher("dir"); });
  $("baixar").addEventListener("click", baixar);
  $("refazer").addEventListener("click", function () { location.reload(); });
})();
</script>
</body>
</html>
